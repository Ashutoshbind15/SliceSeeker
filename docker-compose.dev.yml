# Dev override: tusd uses host networking so it can reach the API and RustFS on localhost.
# Usage: pnpm infra:dev

services:
  tusd:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    command:
      - -verbose
      - -cors-allow-origin=^http://(localhost|127\.0\.0\.1):5173$
      - -s3-bucket=uploads
      - -s3-endpoint=http://127.0.0.1:9000
      - -s3-object-prefix=tus/
      - -hooks-http=${TUSD_HOOKS_URL:-http://127.0.0.1:3000/api/tusd-hooks}
