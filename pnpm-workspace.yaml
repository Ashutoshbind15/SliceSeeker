packages:
  - "client"
  - "packages/*"
  - "search"
  - "server"
  - "worker"
  - "docs"
minimumReleaseAge: 7200
saveExact: true
# Transitive security pins. Exact versions only. Direct deps that have no
# patched release (express, @uppy/core) or that leave an older copy beside a
# newer one (postcss). shadcn 4.18.0 drops the MCP SDK tree but is younger
# than minimumReleaseAge; pin its vulnerable transitives instead.
overrides:
  qs: "6.15.3"
  postcss: "8.5.23"
  "nanoid@3": "3.3.18"
  "nanoid@5": "5.1.16"
  hono: "4.13.1"
  "@hono/node-server": "1.19.17"
  fast-uri: "3.1.5"
  ip-address: "10.4.0"
# strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
